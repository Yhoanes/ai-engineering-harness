task_id: "HARNESS-BOOTSTRAP-0003"
task_type: "standard"
title: "Inject Task Proposal into Context Bundle"
description: |
  Modify `engine/context/loader.py` to ensure that for a given task, its architectural proposal is automatically injected into the `ContextBundle` and subsequently the `final_prompt`.

  REQUIREMENTS:
  1. In `engine/context/loader.py`, within `load_context` (Level 2 processing), when a valid `task_id` is provided, append `(f"proposals/{task_id}.md", 2)` to `targets` alongside `tasks/{task_id}.yaml`.
  2. The existing safe resolution loop will naturally ignore the file if it does not exist (preserving backward compatibility for tasks without proposals).
  3. No other structural changes should be made to path resolution, maintaining existing protections against traversal.

  TESTING:
  Update or add tests in `tests/test_context_loader.py`:
  - Valid task + proposal exist: Both are loaded into `ContextBundle.content_sections`.
  - Task exists, proposal absent: Only task is loaded, no error or failure is raised.
  - Another task's proposal exists: Only the target task's proposal is loaded; others are ignored.
  - Path traversal is prevented (re-verify `resolve_safe_path` behavior).
