description: 'Implement the first concrete ExecutionProvider by wrapping the legacy
  Antigravity runtime.

  This provider acts as a strict compatibility layer with a fail-closed authority
  profile.


  ExecutionRequest is the absolute source of authority.


  Support Profile (Pre-execution rejection if violated):

  - purpose == IMPLEMENT

  - terminal_allowed == True

  - network_allowed == True

  - forbidden_actions == empty (Any populated forbidden action triggers rejection
  as the legacy runtime cannot authoritatively enforce it).

  '
