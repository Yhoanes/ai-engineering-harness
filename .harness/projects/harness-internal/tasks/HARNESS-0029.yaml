  Perform a micro-correction to the ExecutionCapabilities model (HARNESS-0027) 
  to resolve the semantic ambiguity of empty collections.
  
  Currently, rozenset() could mean "deny-all" or "unrestricted" depending on 
  the implicit context. This task introduces a rigorous, explicit ScopedAccess 
  model using AccessMode (DENY_ALL, ALLOW_LIST, UNRESTRICTED).
  
  This disambiguation unblocks HARNESS-0028, allowing the legacy provider to 
  authoritatively and safely evaluate what it can and cannot support.

