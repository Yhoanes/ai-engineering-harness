task_id: HARNESS-0019
task_type: standard
title: Dynamic Selection and Delegation of Specialists
description: |
  Implement deterministic specialist selection using canonical sources (core/specialists, core/workflows, core/authority).
  Remove hardcoded specialist assignments like backend-engineer.
  Preserve already approved assignments without automatic replacement.
  Safely escalate to human approval on ties, low confidence, or missing specialists.
  Validate existence and authorization of specialists before assignment.
  Ensure /new-project remains conversational and read-only until human approval.
  Update tests, diagnostics, and documentation.
