task_id: HARNESS-0026
task_type: standard
title: Migrate Harness Metadata to .harness Structure
description: |
  Perform the physical migration of all Harness metadata out of the `projects/` 
  workspace and into the new `.harness/projects/` structure, solidifying the 
  Harness 2.0 boundary. `projects/` will be strictly reserved for actual user software.

  The metadata for internal governance will reside physically at 
  `.harness/projects/harness-internal/`, establishing `harness-internal` as the 
  canonical logical project ID while supporting `.harness-internal` and 
  `_harness-internal` as legacy aliases for historical Task Contracts.
