acceptance_criteria:
  - "MetadataPaths protects against split-brain using a robust '_has_governed_metadata' check, ensuring empty or residual local directories (like 'scratch/') do not trigger false positives."
  - "Explicit tracked migration via PowerShell: git ls-files captures explicit list of tracked files to git mv individually."
  - "Explicit untracked preservation via PowerShell: HARNESS-0022 and HARNESS-0026 are manually moved with Move-Item, remaining untracked. Hashes verified via relative paths."
  - "MetadataPaths maps logical 'harness-internal' to new root '.harness/projects/harness-internal/' while correctly identifying the legacy physical root 'projects/.harness-internal/'."
  - "source-of-truth.yaml is intentionally excluded from this migration to preserve machine-readability for unmigrated projects."
  - "Self-migration sequence resolves via the MetadataPaths fallback seamlessly. Fail-closed during migration is expected."
  - "engine/distribution/builder.py explicitly excludes .harness/."
  - "Rollback strategy relies on path-scoped git restore --staged and --worktree targeting only explicitly modified Python files and migration paths. 'scratch' remains untouched."
  - "All unit and E2E tests pass."
