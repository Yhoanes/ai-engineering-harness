task_id: "HARNESS-BOOTSTRAP-0002"
task_type: "standard"
title: "Materialize Task Artifacts in Sandbox"
description: |
  Fix the autonomous runner to explicitly materialize governed artifacts (Task Contract and Proposal) 
  for the current task into the WorktreeSandbox, even if they are untracked in HEAD.

  REQUIREMENTS:
  1. Define a private method `_materialize_task_artifacts(self, sandbox_path: Path, request: AntigravityRequest)` in `AutonomousRunner`.
  2. Validate `request.task_id` against `^[A-Z0-9_-]+$` and `request.project` against `^[a-zA-Z0-9_.-]+$` (and no `..`).
  3. Resolve the authoritative project directory (checking `request.project` then `.harness-internal`).
  4. If `tasks/<TASK_ID>.yaml` exists in the main tree, use `shutil.copy2` to copy it to the sandbox at the corresponding relative path.
  5. If `proposals/<TASK_ID>.md` exists in the main tree, use `shutil.copy2` to copy it to the sandbox at the corresponding relative path.
  6. If the proposal does NOT exist, DO NOTHING (preserve current behavior, do not fail).
  7. DO NOT copy anything else (no other tasks, no other proposals, no specialists, no dirty tree).
  8. Replace the inline task copying loop in `run()` (around line 123) with a call to this new method.

  TESTING:
  Update or add tests in `tests/test_autonomous_runner.py` for:
  - Both task and proposal exist -> both copied.
  - Task exists, proposal absent -> only task copied, no error.
  - Other task/proposal -> not copied.
  - Path traversal injection -> ValueError.
  - Arbitrary untracked files (e.g. specialists) -> not copied.
