task_id: HARNESS-0020
task_type: standard
title: Governed Autonomous Workflow Execution
description: 'Implement a governed autonomous execution loop in the Harness that allows  automatic
  handoffs between workflows and specialists while strictly enforcing human gates
  (approval and acceptance) and step limits. When resuming from a human gate, the
  system must reload the contract from disk, reevaluate via the Router and State Machine,
  and never blindly reuse an old plan.

  '
