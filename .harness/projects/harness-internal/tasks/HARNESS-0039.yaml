project: harness-internal
task_id: HARNESS-0039
task_type: standard
title: Executable Task Validator CLI
description: |-
  The engine/validators/validate_task_contract.py module currently lacks an executable entrypoint (__main__), causing it to return process exit 0 when invoked directly, even if validation is not performed or fails.
  This task introduces a minimal executable CLI wrapper around the existing validate() function. The CLI will provide deterministic process exit semantics (0 for PASS, 1 for validation FAIL, 2 for I/O or syntax errors) without duplicating validation logic or altering the programmatic API.
