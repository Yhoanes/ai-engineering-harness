task_id: HARNESS-0003
task_type: standard
title: Implement Router, Orchestrator Runtime, and Context Loader
description: 'Implement the coordination runtime layer for the AI Engineering Harness
  to connect user requests, specialists, workflows, contracts, and progressive context.


  Architectural Clarifications:

  1. PROJECT ROOT RESOLUTION: The system uses a deterministic `resolve_project_root`
  function mapping `_harness-internal` explicitly to `projects/.harness-internal/`
  and general projects to `projects/<key>/`. Strict validation prevents `../`, absolute
  paths, and external symlinks.

  2. TASK ID MATERIALIZATION: The Orchestrator calls `next_task_id(existing_ids, prefix="TASK")`
  to predictably generate sequential IDs (e.g., TASK-0001) without randomness or UUIDs,
  ensuring determinism and collision safety.

  3. INTERNAL MODELS: Using strictly typed `dataclasses` for `RouteDecision`, `OrchestratorHandoff`,
  and `ContextBundle`. `__post_init__` enforces invariants like `0.0 <= confidence
  <= 1.0` and `context_level in {0, 1, 2, 3}`.

  4. ROUTING: The Router only recommends. Lacking an approved contract for implementation
  routes to `plan-task` or `approve-task`. Only the Authority Matrix + Contract determines
  execution rights.

  5. CONTEXT SAFETY: The Loader enforces deterministic byte limits per file/bundle,
  rejects binary files, skips unreadable files with a warning, and aggressively rejects
  external symlink escapes.'
