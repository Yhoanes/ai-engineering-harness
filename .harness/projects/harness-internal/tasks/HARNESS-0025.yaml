task_id: HARNESS-0025
task_type: standard
title: Introduce Harness Metadata Path Abstraction
description: |
  Create a single metadata path resolver component to abstract away 
  the hardcoded 'projects/<project>/tasks|evidence|proposals' paths. 
  This prepares the system for the upcoming Harness 2.0 migration to 
  '.harness/' without moving any physical files yet.
  
  The MetadataPaths component will strictly handle ONLY metadata resolution. 
  It will centralize and reuse existing canonical regex validations for 
  project_id, task_id, and safe path traversal, avoiding duplication.
