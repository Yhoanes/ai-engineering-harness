task_id: "HARNESS-BOOTSTRAP-0004"
task_type: "standard"
title: "Harden Antigravity CLI Execution Result Handling"
description: |
  Modify `adapters/antigravity/cli_executor.py` to prevent anomalous empty completions from being treated as successful agent work, and preserve critical diagnostic evidence (like bounded `stderr`, `num_turns`, and `returncode`) regardless of the host exit code.

  REQUIREMENTS:
  1. Add a helper function `_truncate_diagnostic(text: str | None, max_chars: int = 8192) -> str` to prevent unbounded error dumps. It should preserve `""` or `None` correctly, and append `... (truncated)` if it exceeds the limit. Use this limit for any raw diagnostic text preserved in exceptions or metadata.
  2. Implement strict semantics for the execution result:
     A. subprocess `returncode != 0` => RuntimeError (Process failure).
     B. stdout empty => RuntimeError.
     C. stdout is invalid JSON => RuntimeError (Parse error).
     D. `parsed.get("status") != "SUCCESS"` => RuntimeError (Host execution).
     E. `response` key missing => RuntimeError.
     F. `response` is not a string => RuntimeError (Type error).
     G. `response` string is empty or whitespace-only => RuntimeError: "agy returned SUCCESS with an empty response".
     H. SUCCESS + non-empty string response => Normal AntigravityResponse.
  3. Ensure every single `RuntimeError` mentioned above captures and embeds the bounded `res.stderr` in its message.
  4. On valid execution (H), securely populate `AntigravityResponse.metadata` with: `conversation_id`, `status`, `num_turns`, `duration_seconds`, `usage`, bounded `stderr`, and `returncode`. Do not invent values if `agy` omits them.
  5. The Empty Diff guardrail remains intact; do not modify `sandbox.py` or `models.py`. Note: This task hardens diagnostic handling; it does NOT guarantee `HARNESS-0022` will be solved, but rather that its next failure will be properly captured.

  TESTING:
  Add or update tests in `tests/test_cli_executor.py`:
  1. SUCCESS + valid non-empty response => success.
  2. SUCCESS + "" => failure.
  3. SUCCESS + whitespace => failure.
  4. SUCCESS + response non-string => failure.
  5. stderr + valid response => success + bounded stderr in metadata.
  6. Enormous stderr => deterministically truncated by helper.
  7. stderr + empty response => error message contains bounded stderr.
  8. returncode != 0 => error behavior preserved.
  9. stdout empty => error.
  10. Invalid JSON => parse error.
  11. status != SUCCESS => host execution error.
  12. metadata securely preserves status, num_turns, usage, duration, returncode.
  13. Regression tests for existing executor mocks.
