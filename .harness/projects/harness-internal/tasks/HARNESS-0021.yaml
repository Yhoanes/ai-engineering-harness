# 🔍 Deviation 🔍
deviation:
  documented: true
  reason: |
    1. Centralized sandbox lifecycle directly in AutonomousRunner instead of engine/orchestrator/orchestrator.py to unify audit trailing and avoid mixing Antigravity-specific execution states (sandbox_created, validated, applied) into the universal Orchestrator engine logic. This required modifying adapters/antigravity/autonomous_runner.py which was originally listed as read-only.
    2. Out of scope modifications were necessary to support the `.harness-internal` canonical project key natively without path traversal vulnerabilities. This required modifying adapters/antigravity/adapter.py, engine/context/loader.py, tests/test_antigravity_adapter.py, and tests/test_context_loader.py to change the regex validation from `^[a-zA-Z0-9_-]+$` to `^[a-zA-Z0-9_.-]+$` while explicitly blocking `..`. These files were not in the originally approved scope.
  authorized_by: "Yhoanes"
  mitigation_plan: "No mitigation required for #1. For #2, strict regex and explicit `..` rejection ensures no path traversal is possible."
  accepted_by: "Yhoanes"
  accepted_at: "2026-08-30T19:44:45-04:00"

