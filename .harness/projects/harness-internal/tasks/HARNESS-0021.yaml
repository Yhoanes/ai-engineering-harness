task_id: "HARNESS-0021"
task_type: "standard"
title: "Native Antigravity CLI Execution Bridge (Sandboxed)"
description: |
  Implement AntigravityCliExecutor utilizing isolated Staging and Git Worktrees
  to execute the agy CLI. The Harness will strictly validate all generated diffs
  in the sandbox before applying any changes to the official repository.
project: "_harness-internal"

