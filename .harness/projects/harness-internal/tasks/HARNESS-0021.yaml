# ─── Acceptance Criteria ───
acceptance_criteria:
  - id: "AC-01"
    description: "plan-task genera el Task Contract en un Staging Dir. El Harness valida el yaml antes de copiarlo a projects/.harness-internal/tasks/."
  - id: "AC-02"
    description: "implement-task crea un Git Worktree temporal (sandbox) antes del dispatch, donde agy opera aisladamente."
  - id: "AC-03"
    description: "Tras 'executed' (éxito en sandbox), el Harness inspecciona el diff del sandbox comprobando que no existan mutaciones fuera del scope aprobado."
  - id: "AC-04"
    description: "Alcanza estado 'validated' si el diff es lícito; y 'applied' cuando el Harness transfiere físicamente y con precisión el diff al workspace oficial."
  - id: "AC-05"
    description: "Audit Trail soporta los estados: sandbox_created, validated, applied, segregando 'executed' de la mutación del repo principal."
  - id: "AC-06"
    description: "Prueba E2E opt-in demuestra físicamente que una mutación fuera de scope (creada por un agente hostil o agy dañado) es capturada en 'validated' y NUNCA llega a 'applied' ni al repo base."
