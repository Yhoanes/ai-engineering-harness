acceptance_criteria:
  - id: "AC-01"
    description: "El schema exige id, display_name, purpose, allowed_specialists, entry_conditions, steps, required_validators, evidence_requirements, exit_conditions, next_workflows, forbidden_actions."
  - id: "AC-02"
    description: "El schema define additionalProperties: false a nivel raíz del workflow."
  - id: "AC-03"
    description: "Los arrays allowed_specialists, required_validators y forbidden_actions exigen uniqueItems: true."
  - id: "AC-04"
    description: "La propiedad 'name' ya no existe ni es requerida; se reemplaza limpia por display_name."
  - id: "AC-05"
    description: "La propiedad preconditions se reemplaza limpia por entry_conditions."
  - id: "AC-06"
    description: "La propiedad postconditions se reemplaza limpia por exit_conditions."
  - id: "AC-07"
    description: "tests/test_schemas.py valida esquemas completos y rechaza exhaustivamente la ausencia de cada campo, tipos inválidos, duplicados o IDs mal formados."
  - id: "AC-08"
    description: "No se rompen los consumers reales (confirmado: 0 consumers reales encontrados)."
  - id: "AC-09"
    description: "Los reviews de code y security se realizan independientemente (read-only)."
