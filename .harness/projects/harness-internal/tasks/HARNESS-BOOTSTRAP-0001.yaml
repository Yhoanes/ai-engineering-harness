    description: "Evidence validator enforces skip_reason when status=skipped"
    verification: "pytest tests/test_evidence.py passes"

  - id: AC-12
    description: "Transition to in_progress occurs AFTER all prechecks, BEFORE any modification"
    verification: "Validator chain order verified in runner.py and tested"

  - id: AC-13
    description: "Implementation baseline captures git_head and verifies clean working tree"
    verification: "Baseline logic tested in test_allowed_paths_post.py"

