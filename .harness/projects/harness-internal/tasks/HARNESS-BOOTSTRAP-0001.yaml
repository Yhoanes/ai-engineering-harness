    description: "Precheck validates planned_paths against authority matrix scope"
    verification: "pytest tests/test_allowed_paths_pre.py passes"

  - id: AC-08
    description: "Postcheck validates actual modified files (from git diff) against scope"
    verification: "pytest tests/test_allowed_paths_post.py passes"

  - id: AC-09
    description: "Authority validator enforces role permissions and forbidden actions"
    verification: "pytest tests/test_authority.py passes"

  - id: AC-10
    description: "Precondition validator blocks workflows when conditions are not met"
