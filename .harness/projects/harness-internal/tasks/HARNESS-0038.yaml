project: harness-internal
task_id: HARNESS-0038
task_type: standard
title: "Runner Exit-Code Semantics"
description: >
  The CLI runner (engine/runner/__main__.py) currently exits with code 0 
  regardless of the governed outcome of a task execution. This causes 
  downstream automation (like CI/CD or shell scripts) to treat FAILED or 
  BLOCKED tasks as successful executions.
  
  This task introduces a deterministic exit-code policy mapping governed 
  ExecutionStatus (and legacy trail outcomes) to distinct non-zero exit codes 
  (e.g., FAILED=11, BLOCKED=12) while preserving exit 1 for uncaught script 
  exceptions.
