id: implement-task
display_name: Implement Task Workflow
description: Workflow for implement-task.
purpose: Exige approved, captura baseline, in_progress, respeta scope, ejecuta V5b,
  produce evidencia.
allowed_specialists:
- backend-engineer
- frontend-engineer
- database-engineer
- data-ai-engineer
- integration-engineer
entry_conditions:
- field: status
