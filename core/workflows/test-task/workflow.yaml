id: test-task
display_name: Test Task Workflow
description: Workflow for test-task.
purpose: 'Register real test results: passed, failed, skipped. Never invent tests.'
allowed_specialists:
- qa-engineer
entry_conditions:
- field: status
  operator: exists
  value: 'true'
steps:
- id: test
  description: Run tests.
  actor: system
  action: test
  required: true
  on_failure: escalate
required_validators:
- V1
- V5a
evidence_requirements:
- id: ev-1
  description: Proof of completion
  type: status
  required: true
exit_conditions:
- field: status
  operator: exists
  value: 'true'
next_workflows:
- id: review-task
  condition_summary: Tests complete
forbidden_actions:
- invent-tests
