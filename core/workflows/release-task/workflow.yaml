id: release-task
display_name: Release Task Workflow
description: Workflow for release-task.
purpose: Requires release readiness, checks, rollback plan, explicit deployment auth.
  No auto-deploy.
allowed_specialists:
- devops-release-engineer
entry_conditions:
- field: status
  operator: exists
  value: 'true'
steps:
- id: release
  description: Perform release.
  actor: system
  action: deploy
  required: true
  on_failure: abort
required_validators:
- V1
- V5a
evidence_requirements:
- id: ev-1
  description: Proof of completion
  type: status
  required: true
exit_conditions:
- field: status
  operator: exists
  value: 'true'
next_workflows:
- id: close-task
  condition_summary: Released
forbidden_actions:
- auto-deploy
