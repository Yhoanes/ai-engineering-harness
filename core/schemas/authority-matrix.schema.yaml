$schema: http://json-schema.org/draft-07/schema#
title: Authority Matrix
type: object
required:
- specialists
additionalProperties: false
properties:
  specialists:
    type: object
    additionalProperties:
      type: object
      required:
      - execution
      properties:
        execution:
          type: object
          required:
          - read_paths
          - modify_paths
          - terminal_commands
          - network_allowed
          additionalProperties: false
          properties:
            read_paths:
              $ref: '#/definitions/AccessScope'
            modify_paths:
              $ref: '#/definitions/AccessScope'
            terminal_commands:
              $ref: '#/definitions/AccessScope'
            network_allowed:
              type: boolean
definitions:
  AccessScope:
    oneOf:
    - type: object
      required:
      - mode
      additionalProperties: false
      properties:
        mode:
          const: deny_all
    - type: object
      required:
      - mode
      additionalProperties: false
      properties:
        mode:
          const: unrestricted
    - type: object
      required:
      - mode
      - values
      additionalProperties: false
      properties:
        mode:
          const: allow_list
        values:
          type: array
          minItems: 1
          items:
            type: string
