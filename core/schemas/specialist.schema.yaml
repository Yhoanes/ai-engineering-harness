# JSON Schema for Specialist Definition
$schema: "http://json-schema.org/draft-07/schema#"
title: "Specialist Definition"
type: object
required:
  - id
  - display_name
  - description
  - category
  - purpose
  - capabilities
  - limitations
  - authority_profile
  - task_capabilities
  - context_requirements
  - output_contract
  - escalation_rules

properties:
  id:
    type: string
    pattern: "^[a-z][a-z0-9-]+$"
  display_name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  category:
    type: string
    enum:
      - meta
      - strategy
      - analysis
      - design
      - implementation
      - quality
      - operations
      - support
  purpose:
    type: string
    minLength: 1
  capabilities:
    type: array
    items: { type: string }
    minItems: 1
  limitations:
    type: array
    items: { type: string }
    minItems: 1
  authority_profile:
    type: string
    minLength: 1
    description: "Must reference an existing specialist ID in the authority matrix"
  task_capabilities:
    type: object
    required:
      - propose_task
      - create_task
      - approve_task
      - accept_task
      - close_task
    properties:
      propose_task: { type: boolean }
      create_task: { type: boolean }
      approve_task: { type: boolean }
      accept_task: { type: boolean }
      close_task: { type: boolean }
    additionalProperties: false
  context_requirements:
    type: array
    items: { type: string }
  output_contract:
    type: object
    properties:
      format:
        type: string
      sections:
        type: array
        items: { type: string }
  escalation_rules:
    type: array
    items: { type: string }
    minItems: 1

additionalProperties: true
