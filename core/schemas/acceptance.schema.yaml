# JSON Schema for Acceptance Validation
$schema: "http://json-schema.org/draft-07/schema#"
title: "Acceptance Gate Schema"
type: object
required:
  - acceptance_status
  - accepted_by
  - accepted_at

properties:
  acceptance_status:
    type: string
    enum: [passed, passed_with_deviation]
  accepted_by:
    type: string
    minLength: 1
  accepted_at:
    type: string
    description: "ISO 8601 datetime"
