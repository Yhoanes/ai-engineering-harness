# JSON Schema for Deviation Block
$schema: "http://json-schema.org/draft-07/schema#"
title: "Deviation Schema"
description: "Required when status is completed_with_deviation"
type: object
required:
  - documented
  - description
  - impact
  - accepted_by
  - accepted_at

properties:
  documented:
    type: boolean
    enum: [true]
  description:
    type: string
    minLength: 1
  impact:
    type: string
    minLength: 1
  accepted_by:
    type: string
    minLength: 1
  accepted_at:
    type: string
    description: "ISO 8601 datetime"
