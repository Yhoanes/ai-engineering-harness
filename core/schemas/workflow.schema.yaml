# JSON Schema for Workflow Definition (HARNESS-0002 universal compatibility)
$schema: "http://json-schema.org/draft-07/schema#"
title: "Workflow Definition"
type: object
additionalProperties: false

required:
  - id
  - display_name
  - description
  - purpose
  - allowed_specialists
  - entry_conditions
  - steps
  - required_validators
  - evidence_requirements
  - exit_conditions
  - next_workflows
  - forbidden_actions

properties:
  id:
    type: string
    pattern: "^[a-z0-9-]+$"
    minLength: 1

  display_name:
    type: string
    minLength: 1

  description:
    type: string

  purpose:
    type: string

  allowed_specialists:
    type: array
    items:
      type: string
    uniqueItems: true

  entry_conditions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field:
          type: string
          minLength: 1
        operator:
          type: string
          enum: [equals, not_equals, contains, exists, one_of]
        value:
          type: string

  steps:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, description, actor, action, required, on_failure]
      properties:
        id:
          type: string
          minLength: 1
        description:
          type: string
        actor:
          type: string
        action:
          type: string
        required:
          type: boolean
        on_failure:
          type: string
          enum: [abort, continue, escalate, manual_intervention]

  required_validators:
    type: array
    items:
      type: string
    uniqueItems: true

  evidence_requirements:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, description, type, required]
      properties:
        id:
          type: string
          minLength: 1
        description:
          type: string
        type:
          type: string
          enum: [file, status, log, review]
        required:
          type: boolean

  exit_conditions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field:
          type: string
          minLength: 1
        operator:
          type: string
          enum: [equals, not_equals, contains, exists, one_of]
        value:
          type: string

  next_workflows:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, condition_summary]
      properties:
        id:
          type: string
          minLength: 1
        condition_summary:
          type: string

  forbidden_actions:
    type: array
    items:
      type: string
    uniqueItems: true
