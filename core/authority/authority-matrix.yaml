# Authority Matrix — Single Source of Truth for Permissions
# Defines the MAXIMUM permissions for each specialist role.
# Task Contracts can only REDUCE these permissions, never exceed them.

specialists:

  general-advisor:
    read: { code: true, docs: true, tasks: true, evidence: true, memory: true }
    modify: { scope: [] }
    terminal: { allowed: false }
    web: { allowed: true }
    task_management:
      propose_task: false
      create_task: false
      review: false
      close: false
    forbidden:
      - approve_task
      - accept_task
      - close_task
      - modify_code
      - execute_terminal
      - invoke_specialist
      - modify_authority
    execution:
      read_paths:
        mode: deny_all
      modify_paths:
        mode: deny_all
      terminal_commands:
        mode: deny_all
      network_allowed: false

