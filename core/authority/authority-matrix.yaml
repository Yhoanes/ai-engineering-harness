  # ─── Harness Maintenance Authority ───
  # Established by direct human governance act (Yhoanes, 2026-08-28T16:32:25-04:00)
  # to resolve the governance bootstrap gap discovered after HARNESS-BOOTSTRAP-0001.
  #
  # GOVERNANCE CONSTRAINTS (not bypassable by Task Contract):
  # - harness-maintainer CANNOT authorize its own changes.
  # - Any Task Contract that modifies core/authority/authority-matrix.yaml
  #   requires explicit human approval AND a different specialist or
  #   direct human governance act.
  # - Authority Matrix + approved Task Contract are BOTH required.
  # - This specialist can NEVER approve or accept any task.
  harness-maintainer:
    read: { code: true, docs: true, tasks: true, evidence: true }
    modify:
      scope:
        - "core/**"
        - "engine/**"
        - "adapters/**"
        - "tests/**"
        - ".harness/projects/harness-internal/**"
        - "templates/**"
        - "docs/**"
        - "install/**"
        - "packaging/**"
        - "README.md"
        - "VERSION"
        - "skills/**"
        - ".gitignore"
        - "pyproject.toml"
        - "dist/**"
        - ".pytest_cache/**"
        - ".ruff_cache/**"
        - "**/__pycache__/**"
        - "__pycache__/**"
    terminal: { allowed: true, restricted_to: [build, test, lint] }
    web: { allowed: false }
    task_management:
      propose_task: true
      create_task: false
      review: false
      close: false
    forbidden:
      - approve_task
      - accept_task
      - close_task
      - deploy
      - create_task
    execution:
      read_paths:
        mode: unrestricted
      modify_paths:
        mode: allow_list
        values:
          - "core/**"
          - "engine/**"
          - "adapters/**"
          - "tests/**"
          - ".harness/projects/harness-internal/**"
          - "templates/**"
          - "docs/**"
          - "install/**"
          - "packaging/**"
          - "README.md"
          - "VERSION"
          - "skills/**"
          - ".gitignore"
          - "pyproject.toml"
          - "dist/**"
          - ".pytest_cache/**"
          - ".ruff_cache/**"
          - "**/__pycache__/**"
          - "__pycache__/**"
      terminal_commands:
        mode: unrestricted
      network_allowed: true
