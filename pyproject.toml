[build-system]

requires = ["setuptools>=68.0"]

build-backend = "setuptools.build_meta"



[tool.setuptools.packages.find]
include = ["engine*", "adapters*", "core*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]



[project]

name = "ai-engineering-harness"

version = "1.13.7"

description = "Reusable AI Engineering Harness with deterministic validation, authority control, and human gates."

requires-python = ">=3.11"

dependencies = [

    "pyyaml>=6.0",

    "jsonschema>=4.0",

]



[project.optional-dependencies]

dev = [

    "pytest>=8.0",

    "pytest-cov>=5.0",

    "ruff>=0.5",

]



[tool.pytest.ini_options]

testpaths = ["tests"]

python_files = ["test_*.py"]



[tool.ruff]

target-version = "py310"

line-length = 100



[tool.ruff.lint]

select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
